[tool.poetry]
name = "graphrag-podcast-ai"
version = "0.1.0"
description = "GraphRAG over podcasts: Neo4j knowledge graph + local embeddings + LLM agents"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
neo4j = "^5.28.0"
fastapi = "^0.115.0"
uvicorn = "^0.34.0"
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
python-dotenv = "^1.0.0"
kafka-python-ng = "^2.2.0"
requests = "^2.32.0"
sentence-transformers = "^3.0"
torch = { version = "^2.4", source = "pytorch-cpu" }  # CPU wheel: keeps the image small
youtube-transcript-api = "^1.2"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.25.0"
black = "^25.0.0"
flake8 = "^7.0.0"
mypy = "^1.10.0"
httpx = "^0.28"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"