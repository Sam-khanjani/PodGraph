name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.04.0-community
        env:
          NEO4J_AUTH: none
        ports: ["7687:7687"]
        options: --health-cmd "wget -qO- http://localhost:7474 || exit 1" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install poetry && poetry install --no-root
      - run: poetry run python -m src.setup.init_neo4j && poetry run python -m src.ingestion.pipeline --no-llm file data/transcripts/*.json
      - run: poetry run pytest src/tests -q --cov=src --cov-report=term-missing

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"  # registry names must be lowercase; the repo is Sam-khanjani/PodGraph
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ env.IMAGE }}:latest
